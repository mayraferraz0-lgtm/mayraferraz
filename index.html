<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Colheita de Flores para o Meu Amor 🌻🖤</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            background-color: #0d0d11;
            color: #f0f0f5;
            font-family: 'Press Start 2P', monospace;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .game-container {
            text-align: center;
            border: 4px solid #222;
            background-color: #121218;
            padding: 20px;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.15);
            border-radius: 8px;
        }
        canvas {
            background: linear-gradient(to bottom, #050508, #161622);
            display: block;
            margin: 15px auto;
            border: 2px solid #333;
            image-rendering: pixelated;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
        }
        h1 {
            font-size: 15px;
            color: #ffd700;
            margin-bottom: 8px;
            text-shadow: 2px 2px #333;
        }
        p {
            font-size: 8px;
            color: #888;
            margin-top: 0;
            margin-bottom: 10px;
        }
        .btn {
            font-family: 'Press Start 2P', monospace;
            background-color: #ffd700;
            color: #121218;
            border: none;
            padding: 12px 24px;
            font-size: 10px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
            border-radius: 4px;
            box-shadow: 0 4px #b8860b;
            transition: 0.1s;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 #b8860b;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>COLHEITA DAS FLORES 🖤🌻</h1>
    <p>Use as setas ⬅️ ➡️ ou arraste o mouse para mover o cesto!</p>
    <canvas id="gameCanvas" width="400" height="420"></canvas>
    <div id="ui-container">
        <button class="btn" id="startBtn">COMEÇAR A COLHER</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');

    let gameState = 'START'; // START, PLAYING, GAMEOVER
    let score = 0;
    let basket = { x: 175, y: 360, width: 50, height: 28, speed: 8 };
    let flowers = [];
    let keys = {};
    let gameTimer = 20; // 20 segundos de colheita
    let timerInterval;

    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    canvas.addEventListener('mousemove', e => {
        const rect = canvas.getBoundingClientRect();
        let mouseX = e.clientX - rect.left;
        basket.x = mouseX - basket.width / 2;
        if (basket.x < 0) basket.x = 0;
        if (basket.x > canvas.width - basket.width) basket.x = canvas.width - basket.width;
    });

    function startGame() {
        gameState = 'PLAYING';
        score = 0;
        flowers = [];
        gameTimer = 20;
        startBtn.style.display = 'none';

        clearInterval(window.spawnInterval);
        window.spawnInterval = setInterval(() => {
            if (gameState === 'PLAYING') {
                flowers.push({
                    x: Math.random() * (canvas.width - 20),
                    y: -20,
                    size: 20,
                    speed: 2.5 + Math.random() * 2,
                    type: Math.random() > 0.4 ? 'sunflower' : 'rose'
                });
            }
        }, 750);

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (gameState === 'PLAYING') {
                gameTimer--;
                if (gameTimer <= 0) {
                    endGame();
                }
            }
        }, 1000);

        loop();
    }

    function endGame() {
        gameState = 'GAMEOVER';
        clearInterval(window.spawnInterval);
        clearInterval(timerInterval);
        startBtn.style.display = 'inline-block';
        startBtn.textContent = 'JOGAR DE NOVO 🌻';
    }

    function update() {
        if (gameState !== 'PLAYING') return;

        if (keys['ArrowLeft'] || keys['a']) basket.x -= basket.speed;
        if (keys['ArrowRight'] || keys['d']) basket.x += basket.speed;

        if (basket.x < 0) basket.x = 0;
        if (basket.x > canvas.width - basket.width) basket.x = canvas.width - basket.width;

        for (let i = flowers.length - 1; i >= 0; i--) {
            let f = flowers[i];
            f.y += f.speed;

            if (
                f.x + f.size > basket.x &&
                f.x < basket.x + basket.width &&
                f.y + f.size > basket.y &&
                f.y < basket.y + basket.height
            ) {
                score++;
                flowers.splice(i, 1);
                continue;
            }

            if (f.y > canvas.height) {
                flowers.splice(i, 1);
            }
        }
    }

    function drawPixelFlower(x, y, type) {
        if (type === 'sunflower') {
            ctx.fillStyle = '#ffcc00'; // Petalas amarelas
            ctx.fillRect(x + 4, y, 12, 4);
            ctx.fillRect(x, y + 4, 20, 12);
            ctx.fillRect(x + 4, y + 16, 12, 4);
            ctx.fillStyle = '#4a2f13'; // Centro marrom
            ctx.fillRect(x + 6, y + 6, 8, 8);
        } else {
            ctx.fillStyle = '#ff2244'; // Rosas vermelhas
            ctx.fillRect(x + 4, y + 2, 12, 14);
            ctx.fillRect(x + 2, y + 6, 16, 8);
            ctx.fillStyle = '#228b22'; // Folhinha
            ctx.fillRect(x + 8, y + 16, 4, 4);
        }
    }

    function drawSunflowerBouquet() {
        let bx = canvas.width / 2 - 35;
        let by = canvas.height / 2 - 40;

        // Papel de embrulho dark/elegante
        ctx.fillStyle = '#22222d';
        ctx.fillRect(bx + 15, by + 45, 40, 55);
        ctx.fillStyle = '#ff69b4'; // Laço rosa fofo
        ctx.fillRect(bx + 10, by + 60, 50, 10);

        // Girassóis do buquê
        for(let i = 0; i < 3; i++) {
            let sx = bx + (i * 22);
            let sy = by + (i % 2 === 0 ? 0 : 12);
            ctx.fillStyle = '#ffcc00';
            ctx.fillRect(sx, sy, 26, 26);
            ctx.fillStyle = '#4a2f13';
            ctx.fillRect(sx + 8, sy + 8, 10, 10);
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (gameState === 'START') {
            ctx.fillStyle = '#ffd700';
            ctx.font = '11px "Press Start 2P"';
            ctx.textAlign = 'center';
            ctx.fillText('PRONTA PARA O DESAFIO?', canvas.width / 2, canvas.height / 2 - 25);
            ctx.fillStyle = '#777';
            ctx.font = '7px "Press Start 2P"';
            ctx.fillText('Clique no botão para começar', canvas.width / 2, canvas.height / 2 + 15);
            return;
        }

        if (gameState === 'PLAYING') {
            // Cesto dark pixel art
            ctx.fillStyle = '#2a2a3b';
            ctx.fillRect(basket.x, basket.y, basket.width, basket.height);
            ctx.fillStyle = '#3f3f59';
            ctx.fillRect(basket.x + 2, basket.y + 2, basket.width - 4, 6);
            ctx.fillStyle = '#ff69b4'; // Coraçãozinho no cesto
            ctx.fillRect(basket.x + 21, basket.y + 11, 8, 8);

            flowers.forEach(f => {
                drawPixelFlower(f.x, f.y, f.type);
            });

            // HUD
            ctx.fillStyle = '#fff';
            ctx.font = '8px "Press Start 2P"';
            ctx.textAlign = 'left';
            ctx.fillText(`FLORES: ${score}`, 15, 25);
            ctx.textAlign = 'right';
            ctx.fillText(`TEMPO: ${gameTimer}s`, canvas.width - 15, 25);

        } else if (gameState === 'GAMEOVER') {
            drawSunflowerBouquet();

            ctx.fillStyle = '#ffd700';
            ctx.font = '10px "Press Start 2P"';
            ctx.textAlign = 'center';
            ctx.fillText('VOCÊ É PRO DEMAIS! 🏆', canvas.width / 2, 45);

            ctx.fillStyle = '#ffb7c5';
            ctx.font = '7px "Press Start 2P"';
            ctx.fillText(`Flores colhidas: ${score} (Profissional!)`, canvas.width / 2, 70);

            ctx.fillStyle = '#fff';
            ctx.font = '7px "Press Start 2P"';
            ctx.fillText('Seu prêmio: um buquê de', canvas.width / 2, canvas.height - 45);
            ctx.fillText('girassóis lindo pro meu amor! 🌻🖤', canvas.width / 2, canvas.height - 28);
        }
    }

    function loop() {
        update();
        draw();
        if (gameState === 'PLAYING') {
            requestAnimationFrame(loop);
        }
    }

    startBtn.addEventListener('click', startGame);
    draw();
</script>
</body>
</html>
